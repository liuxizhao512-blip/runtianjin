<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="See route details, distance, surface, and city running notes for each Tianjin route."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Route Details | Run Tianjin" />
    <meta
      property="og:description"
      content="See route details, distance, surface, and city running notes for each Tianjin route."
    />
    <meta property="og:image" content="run-tianjin-share-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Route Details | Run Tianjin" />
    <meta
      name="twitter:description"
      content="See route details, distance, surface, and city running notes for each Tianjin route."
    />
    <meta name="twitter:image" content="run-tianjin-share-card.jpg" />
    <title>Route Details | Run Tianjin</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="favicon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="favicon-180x180.png" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header id="site-header"></header>

    <main class="page-shell detail-page">
      <article id="route-detail" class="detail-card" aria-live="polite"></article>
    </main>

    <div id="image-modal" class="image-modal" aria-hidden="true">
      <div class="modal-backdrop" data-close="true"></div>
      <div class="modal-content">
        <button class="modal-close" type="button" aria-label="Close image">×</button>
        <div id="modal-image" class="modal-image"></div>
      </div>
    </div>

    <footer class="site-footer">
      <p>© 2026 Run Tianjin · Tianjin running route guide</p>
    </footer>

    <script src="nav.js"></script>
    <script>
      const routes = {
        haihe: {
          id: 'haihe',
          name: 'Haihe Riverside Run',
          distance: '7.7 km',
          duration: '40–50 minutes',
          start: 'Tianjin Eye riverside path',
          end: 'Jinwan Plaza riverside section',
          tag: 'Scenic night run',
          imageClass: 'thumb-haihe',
          image: 'haihe-riverside-run.jpg',
          description: 'From Tianjin Eye along the Haihe riverside toward Jinwan Plaza, this route offers broad city views and a relaxed urban running experience.',
          routeType: 'Urban riverside run',
          suitableFor: 'Beginners, easy runners, night runners, city-view lovers',
          surface: 'Flat asphalt road with stable footing and easy pacing.',
          bestTime: 'Evening, 18:30–20:30, when the city lights are most beautiful.',
          supplies: 'Water stations and rest points are available near Tianjin Eye and Jinwan Plaza.',
          lighting: 'Moderate lighting along the riverside; some sections remain darker after sunset.',
          pace: 'Easy run, steady rhythm, relaxed cadence work',
          notes: 'The wind is stronger at night, so a light windbreaker is useful. If you want photos, choose a wide view spot.',
          strengths: 'Night scenery, broad city skyline, stable road surface',
          avoid: 'Extreme heat at midday and very dark sections without reflective gear',
          recommendation: 'Best for 35–50 minute easy sessions and light stride practice.'
        },
        nancui: {
          id: 'nancui',
          name: 'South Cuiping Park Loop',
          distance: '3 km',
          duration: '15–25 minutes',
          start: 'South Cuiping Park entrance',
          end: 'Same park loop return',
          tag: 'Beginner-friendly',
          imageClass: 'thumb-nancui',
          image: 'south-cuiping-park-loop.jpg',
          description: 'This loop uses the park’s rubberized track, which is comfortable for beginners and ideal for short interval practice.',
          routeType: 'Park loop',
          suitableFor: 'New runners, first-time joggers, interval practice',
          surface: 'Rubber track with good elasticity and a soft landing feel.',
          bestTime: 'Morning, 7:00–9:00, when the air feels fresher and cooler.',
          supplies: 'There are basic rest and water facilities near the park entrance and service area.',
          lighting: 'Good daylight conditions; well-lit around the main track and park path.',
          pace: 'Easy run, short intervals, light tempo',
          notes: 'For interval training, control your stride and breathing rhythm to avoid early fatigue.',
          strengths: 'Soft landing surface, short distance, beginner-friendly loops',
          avoid: 'Crowded hours and overly intense interval blocks for new runners',
          recommendation: 'Ideal for short, confidence-building sessions and simple form work.'
        },
        shuishang: {
          id: 'shuishang',
          name: 'Water Park Lakeside Loop',
          distance: '5 km',
          duration: '25–35 minutes',
          start: 'Water Park main gate',
          end: 'Lakeside loop return',
          tag: 'Daily easy run',
          imageClass: 'thumb-shuishang',
          image: 'water-park-lakeside-loop.jpg',
          description: 'This lakeside route is relaxed, shaded, and scenic—perfect for regular runs and low-stress training days.',
          routeType: 'Lakefront circuit',
          suitableFor: 'Daily runners, easy mileage, relaxed training',
          surface: 'A mix of pedestrian paths and park trails, generally smooth and comfortable.',
          bestTime: 'Morning 8:00–10:00 or evening 17:30–19:00.',
          supplies: 'Rest areas and drinking points are available around the lake and park service zone.',
          lighting: 'Good visibility in daytime; evening sections are comfortable but still need basic awareness.',
          pace: 'Easy aerobic run, recovery day, steady mileage',
          notes: 'In summer, choose early or late hours and keep a safe distance from the lake edge when running.',
          strengths: 'Shade, calm atmosphere, comfortable for routine training',
          avoid: 'Strong midday heat and slippery edges after rain',
          recommendation: 'A low-pressure choice for habit-building and daily aerobic running.'
        },
        taida: {
          id: 'taida',
          name: 'Binhai TEDA Coastal Path',
          distance: '6.7 km',
          duration: '30–40 minutes',
          start: 'Coastal path entrance near family recreation area',
          end: 'Long coastal return point',
          tag: 'Long-distance training',
          imageClass: 'thumb-taida',
          image: 'binhai-teda-coastal-path.jpg',
          description: 'The wide coastal path offers a spacious environment for long, steady runs and rhythm-based training.',
          routeType: 'Coastal distance route',
          suitableFor: 'Intermediate runners, long-distance training, steady pacing',
          surface: 'Wide paved walkway with consistent footing and easy access.',
          bestTime: 'Early morning 6:30–8:00 or evening 18:00–19:30.',
          supplies: 'Rest areas, public utilities, and convenience points are available along the route.',
          lighting: 'Open coastal setting with decent visibility; wind can be stronger near the water.',
          pace: 'Steady state, long run, rhythm-based training',
          notes: 'For longer sessions, hydrate early, wear breathable shoes, and keep your pace steady.',
          strengths: 'Wide route, open air, excellent for aerobic mileage',
          avoid: 'Strong coastal wind and very hot midday conditions',
          recommendation: 'Best for longer sessions and rhythm work when you want open space.'
        }
      };

      /* Extra depth per route: what you run past, how to split the effort,
         and what to actually do with the session. Kept in the same shape as
         the map page so the two pages tell the same story. */
      const routeDepth = {
        haihe: {
          scenery: [
            { name: 'Tianjin Eye', note: 'A 120 m Ferris wheel built over the Yongle Bridge. The loop starts directly beneath it, and the wheel is lit after dark.' },
            { name: 'Jiefang Bridge', note: 'A 1927 steel truss bridge that still opens for boats. Flat deck and a wide footway make it the smoothest crossing on the river.' },
            { name: 'Jinwan Plaza riverbank', note: 'The far bank opens up here — skyline on one side, water on the other. Best light is about 30 minutes before sunset.' }
          ],
          splits: [
            { label: '0–2 km', focus: 'Settle in', detail: 'Start under the Eye and let the crowd thin out. Keep it conversational; this stretch is the busiest.' },
            { label: '2–5 km', focus: 'Steady middle', detail: 'The riverside straightens out past Jiefang Bridge. This is where rhythm work feels easiest.' },
            { label: '5–7.7 km', focus: 'Bring it home', detail: 'Skyline section toward Jinwan Plaza. Hold the pace rather than pushing — the wind picks up here.' }
          ],
          session: 'Run it as an easy 40-minute aerobic session with four 20-second strides in the last kilometre. The flat deck makes it a good place to practise cadence without worrying about footing.'
        },
        nancui: {
          scenery: [
            { name: 'Cuiping Hill', note: 'The park is built around a low wooded hill, so the loop rolls gently instead of staying dead flat. Shaded almost the whole way in summer.' },
            { name: 'Ski slope', note: 'A dry ski slope sits inside the park. Busiest corner in winter; a quiet landmark to run past the rest of the year.' }
          ],
          splits: [
            { label: '0–1 km', focus: 'Warm up', detail: 'Easy lap on the rubber track. Let the surface do the work — it is forgiving, so resist overstriding.' },
            { label: '1–2.5 km', focus: 'Intervals', detail: 'Four rounds of 1 minute quick / 1 minute easy. The short loop means you are never far from the start.' },
            { label: '2.5–3 km', focus: 'Cool down', detail: 'Walk-jog the last half kilometre. Good place to check form in the park mirrors by the entrance.' }
          ],
          session: 'Best used for a first interval session: 4 × 1 minute at a comfortably hard effort with equal easy jogging between. The soft track keeps the impact low while you learn pacing.'
        },
        shuishang: {
          scenery: [
            { name: 'West Lake', note: 'The calmer of the two lakes. The path hugs the shore, so you get a continuous water line on your left for most of this stretch.' },
            { name: 'Tianjin Zoo', note: 'The zoo entrance sits at the south end of the loop. Expect families and strollers at weekends — the one section worth slowing down for.' },
            { name: 'East Lake dock', note: 'Small boat dock on the east lake. Open sight lines and a wide paved apron make it a natural turnaround point.' }
          ],
          splits: [
            { label: '0–1.5 km', focus: 'Find a rhythm', detail: 'West Lake shoreline. Flat and shaded — use it to lock into an easy cadence.' },
            { label: '1.5–3.5 km', focus: 'Watch your footing', detail: 'The path narrows near the zoo entrance. Slow down here on weekends and after rain.' },
            { label: '3.5–5 km', focus: 'Finish relaxed', detail: 'East Lake dock to the gate. Keep the effort easy; this is a recovery route, not a tempo route.' }
          ],
          session: 'Treat it as a recovery run: 25–35 minutes at a pace where you could hold a conversation. If you are adding mileage, this is the route to add it on, not the park loop.'
        },
        taida: {
          scenery: [
            { name: 'TEDA Football Stadium', note: 'Home ground of Tianjin Jinmen Tiger. On match days the surrounding roads close to traffic, turning the approach into a wide open running lane.' },
            { name: 'TEDA MSD circle', note: 'The modern business district: glass towers, wide empty pavements, almost no pedestrians at weekends. This is where the route feels fastest.' },
            { name: 'Beihai Road interchange', note: 'The one real junction on the route. Cross under the flyover rather than over it — the underpass keeps you off the traffic lights.' }
          ],
          splits: [
            { label: '0–2 km', focus: 'Ease out', detail: 'Wide coastal walkway. Resist starting too fast just because the path is open.' },
            { label: '2–5 km', focus: 'Steady state', detail: 'The long straight past MSD. This is the block to hold goal pace — flat, uninterrupted, easy to measure.' },
            { label: '5–6.7 km', focus: 'Hold form', detail: 'Back toward the stadium. Coastal wind usually hits here, so shorten your stride and keep cadence up.' }
          ],
          session: 'Use it for a steady-state block: 20 minutes at a pace slightly faster than easy, sandwiched between 10-minute warm-up and cool-down. The open path makes pacing honest.'
        }
      };

      const detailRoot = document.getElementById('route-detail');
      const modal = document.getElementById('image-modal');
      const modalImage = document.getElementById('modal-image');
      const closeBtn = document.querySelector('.modal-close');
      const routeKey = new URLSearchParams(window.location.search).get('route') || 'haihe';
      const route = routes[routeKey] || routes.haihe;

      detailRoot.innerHTML = `
        <div class="detail-visual">
          <div class="route-visual" role="button" tabindex="0" aria-label="View ${route.name} image">
            <img src="${route.image || ''}" alt="${route.name}" class="route-photo" />
          </div>

          <div class="route-visual-card">
            <h2>Quick route summary</h2>
            <div class="route-visual-grid">
              <div>
                <span>Start</span>
                <strong>${route.start}</strong>
              </div>
              <div>
                <span>Finish</span>
                <strong>${route.end}</strong>
              </div>
              <div>
                <span>Distance</span>
                <strong>${route.distance}</strong>
              </div>
              <div>
                <span>Duration</span>
                <strong>${route.duration}</strong>
              </div>
            </div>
          </div>

          <div class="detail-info-box">
            <h2>Route information</h2>
            <ul>
              <li><strong>Suitable for:</strong> ${route.suitableFor}</li>
              <li><strong>Best running style:</strong> ${route.pace}</li>
              <li><strong>Surface:</strong> ${route.surface}</li>
              <li><strong>Best time:</strong> ${route.bestTime}</li>
              <li><strong>Lighting / safety:</strong> ${route.lighting}</li>
              <li><strong>Water / rest points:</strong> ${route.supplies}</li>
              <li><strong>What stands out:</strong> ${route.strengths}</li>
              <li><strong>Key caution:</strong> ${route.avoid}</li>
              <li><strong>Recommended use:</strong> ${route.recommendation}</li>
            </ul>
          </div>
        </div>
        <div class="detail-copy">
          <p class="eyebrow">Route details</p>
          <h1>${route.name}</h1>
          <div class="detail-badges">
            <span>${route.distance}</span>
            <span>${route.tag}</span>
            <span>${route.routeType}</span>
          </div>
          <p>${route.description}</p>

          <div class="detail-actions">
            <a class="primary-btn" href="routes.html">Back to routes</a>
          </div>
        </div>
      `;

      const depth = routeDepth[route.id];
      if (depth) {
        const depthHost = document.createElement('div');
        depthHost.className = 'detail-depth';
        depthHost.innerHTML = `
          <section class="detail-block" aria-labelledby="scenery-heading">
            <p class="eyebrow">Along the way</p>
            <h2 id="scenery-heading">What you run past</h2>
            <ul class="detail-scenery-list">
              ${depth.scenery.map((spot, i) => `
                <li class="detail-scenery-item">
                  <span class="detail-scenery-index">${String(i + 1).padStart(2, '0')}</span>
                  <div>
                    <strong>${spot.name}</strong>
                    <p>${spot.note}</p>
                  </div>
                </li>
              `).join('')}
            </ul>
          </section>

          <section class="detail-block" aria-labelledby="splits-heading">
            <p class="eyebrow">How to run it</p>
            <h2 id="splits-heading">Splitting the distance</h2>
            <ol class="detail-splits">
              ${depth.splits.map((split) => `
                <li class="detail-split">
                  <span class="detail-split-range">${split.label}</span>
                  <strong>${split.focus}</strong>
                  <p>${split.detail}</p>
                </li>
              `).join('')}
            </ol>
          </section>
        `;
        detailRoot.appendChild(depthHost);

        // "What to do with it" lives in the left-hand detail column, under Route information
        const sessionHost = document.createElement('section');
        sessionHost.className = 'detail-block detail-block--session';
        sessionHost.setAttribute('aria-labelledby', 'session-heading');
        sessionHost.innerHTML = `
          <p class="eyebrow">Suggested session</p>
          <h2 id="session-heading">What to do with it</h2>
          <p>${depth.session}</p>
        `;
        const copyColumn = detailRoot.querySelector('.detail-copy');
        const actions = copyColumn && copyColumn.querySelector('.detail-actions');
        if (copyColumn && actions) {
          copyColumn.insertBefore(sessionHost, actions);
        } else if (copyColumn) {
          copyColumn.appendChild(sessionHost);
        }
      }

      const visual = document.querySelector('.route-visual');
      if (visual) {
        const openModal = () => {
          modal.classList.add('show');
          modal.setAttribute('aria-hidden', 'false');
          modalImage.innerHTML = `<img src="${route.image || ''}" alt="${route.name}" />`;
        };

        visual.addEventListener('click', openModal);
        visual.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            openModal();
          }
        });
      }

      const closeModal = () => {
        modal.classList.remove('show');
        modal.setAttribute('aria-hidden', 'true');
      };

      closeBtn.addEventListener('click', closeModal);
      modal.addEventListener('click', (event) => {
        if (event.target.dataset.close === 'true') {
          closeModal();
        }
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && modal.classList.contains('show')) {
          closeModal();
        }
      });
    </script>
  </body>
</html>
