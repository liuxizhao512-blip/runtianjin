<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Run Tianjin 3D</title>
    <style>
      :root {
        --bg: #0b1a2b;
        --panel: rgba(10, 18, 28, 0.72);
        --panel-border: rgba(255, 255, 255, 0.12);
        --text: #e7f0ff;
        --muted: #a8c0d9;
        --accent: #7ae7c7;
        --warn: #ffbf69;
        --danger: #ff6a6a;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #hud {
        position: fixed;
        top: 18px;
        left: 18px;
        z-index: 10;
        display: flex;
        gap: 12px;
        pointer-events: none;
      }

      .stat {
        min-width: 170px;
        padding: 12px 16px;
        border-radius: 14px;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        backdrop-filter: blur(6px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.18);
      }

      .stat-label {
        display: block;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 4px;
      }

      .stat-value {
        font-size: 26px;
        font-weight: 700;
        line-height: 1.1;
      }

      #alert {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        z-index: 10;
        min-width: 320px;
        text-align: center;
        padding: 10px 18px;
        border-radius: 999px;
        background: rgba(5, 12, 20, 0.7);
        border: 1px solid var(--panel-border);
        color: var(--text);
        letter-spacing: 0.06em;
        opacity: 0;
        transition: opacity 0.25s ease;
        pointer-events: none;
      }

      #alert.show {
        opacity: 1;
      }

      #alert.warn {
        border-color: rgba(255, 191, 105, 0.6);
        color: var(--warn);
      }

      #alert.danger {
        border-color: rgba(255, 106, 106, 0.7);
        color: var(--danger);
      }

      .hint {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 10;
        background: rgba(11, 26, 43, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: var(--muted);
        border-radius: 12px;
        padding: 10px 14px;
        font-size: 12px;
        line-height: 1.6;
        max-width: 260px;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <div class="stat">
        <span class="stat-label">Distance</span>
        <span id="distanceValue" class="stat-value">0.00 km</span>
      </div>
      <div class="stat">
        <span class="stat-label">Speed</span>
        <span id="speedValue" class="stat-value">0.0 m/s</span>
      </div>
    </div>

    <div id="alert">Click the scene to control the camera</div>

    <div class="hint">
      WASD move<br />
      Shift sprint<br />
      Space jump<br />
      Mouse look
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
    <script>
      // ===== 基础场景 =====
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xbfd8e6);
      scene.fog = new THREE.Fog(0xbfd8e6, 45, 180);

      const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 500);
      camera.position.set(0, 3.5, 11);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.appendChild(renderer.domElement);

      // ===== 光照 =====
      const hemi = new THREE.HemisphereLight(0xf6fbff, 0x2c3d2d, 1.2);
      scene.add(hemi);

      const sun = new THREE.DirectionalLight(0xfff7dc, 1.3);
      sun.position.set(30, 40, 18);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.camera.left = -80;
      sun.shadow.camera.right = 80;
      sun.shadow.camera.top = 80;
      sun.shadow.camera.bottom = -80;
      sun.shadow.camera.near = 1;
      sun.shadow.camera.far = 150;
      scene.add(sun);

      // ===== 地面与城市基础 =====
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(260, 260),
        new THREE.MeshStandardMaterial({ color: 0xb8d7ad, roughness: 0.96, metalness: 0.02 })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      const roadMaterial = new THREE.MeshStandardMaterial({ color: 0x363b42, roughness: 0.9, metalness: 0.08 });
      const sidewalkMaterial = new THREE.MeshStandardMaterial({ color: 0xc4c9ce, roughness: 0.95, metalness: 0.05 });
      const edgeMaterial = new THREE.MeshStandardMaterial({ color: 0x8e949d, roughness: 0.8, metalness: 0.12 });
      const roadMarkMaterial = new THREE.MeshStandardMaterial({ color: 0xf6f7f8, emissive: 0x101010, roughness: 0.7 });

      const roadSegments = [];
      const buildings = [];
      const cars = [];

      function createRoad(x, z, length, width) {
        const road = new THREE.Mesh(new THREE.BoxGeometry(length, 0.18, width), roadMaterial);
        road.position.set(x, 0.08, z);
        road.receiveShadow = true;
        scene.add(road);

        const sidewalkWidth = 3.5;
        const sidewalkX = new THREE.Mesh(new THREE.BoxGeometry(length + 2, 0.2, sidewalkWidth), sidewalkMaterial);
        sidewalkX.position.set(x, 0.12, z + width / 2 + sidewalkWidth / 2);
        scene.add(sidewalkX);

        const sidewalkZ = new THREE.Mesh(new THREE.BoxGeometry(length + 2, 0.2, sidewalkWidth), sidewalkMaterial);
        sidewalkZ.position.set(x, 0.12, z - width / 2 - sidewalkWidth / 2);
        scene.add(sidewalkZ);

        // 道路中心线和边线
        const markCount = Math.max(3, Math.floor(length / 16));
        for (let i = 0; i < markCount; i++) {
          const marker = new THREE.Mesh(new THREE.BoxGeometry(6, 0.03, 0.35), roadMarkMaterial);
          const progress = (i / (markCount - 1)) * 2 - 1;
          marker.position.set(x, 0.24, z + progress * (length * 0.18));
          if (width > 8) {
            marker.rotation.y = Math.PI / 2;
            marker.scale.z = 1;
          }
          scene.add(marker);
        }

        roadSegments.push({ x, z, length, width });
      }

      // 生成城市骨架：主路 + 次路
      const roadGrid = [-72, -36, 0, 36, 72];
      for (const x of roadGrid) {
        createRoad(x, 0, 220, 12);
      }
      for (const z of roadGrid) {
        createRoad(0, z, 12, 220);
      }

      // 生成建筑群（低多边形风格）
      for (let ix = 0; ix < roadGrid.length - 1; ix++) {
        for (let iz = 0; iz < roadGrid.length - 1; iz++) {
          const x1 = roadGrid[ix];
          const x2 = roadGrid[ix + 1];
          const z1 = roadGrid[iz];
          const z2 = roadGrid[iz + 1];

          const blockCenterX = (x1 + x2) / 2;
          const blockCenterZ = (z1 + z2) / 2;

          const buildingCount = 3 + Math.floor(Math.random() * 4);
          for (let b = 0; b < buildingCount; b++) {
            const bx = blockCenterX + (Math.random() - 0.5) * 18;
            const bz = blockCenterZ + (Math.random() - 0.5) * 18;
            const w = 5 + Math.random() * 8;
            const d = 5 + Math.random() * 8;
            const h = 6 + Math.random() * 18;
            const buildingMat = new THREE.MeshStandardMaterial({
              color: new THREE.Color().setHSL(0.08 + Math.random() * 0.04, 0.2, 0.58),
              roughness: 0.9,
              metalness: 0.06
            });

            const building = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), buildingMat);
            building.position.set(bx, h / 2, bz);
            building.castShadow = true;
            building.receiveShadow = true;
            scene.add(building);

            buildings.push({
              center: new THREE.Vector3(bx, h / 2, bz),
              size: new THREE.Vector3(w / 2, h / 2, d / 2),
              mesh: building
            });
          }
        }
      }

      // 路口标志和小型路边装置
      const plazaMat = new THREE.MeshStandardMaterial({ color: 0xd9dfe6, roughness: 0.85 });
      for (const x of [-36, 36]) {
        for (const z of [-36, 36]) {
          const marker = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.35, 2.5), plazaMat);
          marker.position.set(x, 0.2, z);
          scene.add(marker);
        }
      }

      // ===== 玩家角色 =====
      const player = new THREE.Group();

      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x73d4ff, roughness: 0.75 });
      const accentMat = new THREE.MeshStandardMaterial({ color: 0x0f1725, roughness: 0.8 });

      const torso = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.5, 0.6), bodyMat);
      torso.position.y = 1.3;
      torso.castShadow = true;
      player.add(torso);

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.46, 18, 18), new THREE.MeshStandardMaterial({ color: 0xf2d5b8, roughness: 0.95 }));
      head.position.y = 2.5;
      head.castShadow = true;
      player.add(head);

      const legLeft = new THREE.Mesh(new THREE.BoxGeometry(0.28, 1.1, 0.28), accentMat);
      legLeft.position.set(-0.26, 0.5, 0);
      legLeft.castShadow = true;
      player.add(legLeft);

      const legRight = legLeft.clone();
      legRight.position.x = 0.26;
      player.add(legRight);

      const armLeft = new THREE.Mesh(new THREE.BoxGeometry(0.22, 1.1, 0.22), accentMat);
      armLeft.position.set(-0.85, 1.45, 0);
      armLeft.castShadow = true;
      player.add(armLeft);

      const armRight = armLeft.clone();
      armRight.position.x = 0.85;
      player.add(armRight);

      player.position.set(0, 0.8, 30);
      scene.add(player);

      const playerState = {
        velocity: new THREE.Vector3(),
        desiredMove: new THREE.Vector3(),
        speed: 0,
        isOnGround: true,
        totalDistance: 0,
        jumpVelocity: 0,
        heading: 0,
        radius: 0.8,
        height: 3.0,
      };

      // ===== 车辆 =====
      function createCar(x, z, dir) {
        const group = new THREE.Group();
        const body = new THREE.Mesh(
          new THREE.BoxGeometry(2.6, 0.8, 1.4),
          new THREE.MeshStandardMaterial({ color: 0xf7a15b, roughness: 0.74, metalness: 0.22 })
        );
        body.position.y = 0.8;
        body.castShadow = true;
        group.add(body);

        const cabin = new THREE.Mesh(
          new THREE.BoxGeometry(1.5, 0.8, 1.1),
          new THREE.MeshStandardMaterial({ color: 0xdfe9f3, roughness: 0.65, metalness: 0.15 })
        );
        cabin.position.set(0.12, 1.4, 0);
        cabin.castShadow = true;
        group.add(cabin);

        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x15181d, roughness: 0.9 });
        const wheelGeo = new THREE.CylinderGeometry(0.28, 0.28, 0.22, 12);
        const wheelPositions = [
          [-0.9, 0.35, 0.72],
          [0.9, 0.35, 0.72],
          [-0.9, 0.35, -0.72],
          [0.9, 0.35, -0.72],
        ];
        wheelPositions.forEach(([xPos, yPos, zPos]) => {
          const wheel = new THREE.Mesh(wheelGeo, wheelMat);
          wheel.rotation.z = Math.PI / 2;
          wheel.position.set(xPos, yPos, zPos);
          wheel.castShadow = true;
          group.add(wheel);
        });

        group.position.set(x, 0, z);
        group.rotation.y = dir;
        scene.add(group);

        const speed = 10 + Math.random() * 9;
        cars.push({ mesh: group, speed, dir, lane: dir === 0 ? 'z' : 'x' });
      }

      // 少量自动行驶车辆
      createCar(48, -12, Math.PI); // 向左
      createCar(-50, 24, 0); // 向前
      createCar(18, 72, Math.PI / 2); // 向下
      createCar(-32, -70, -Math.PI / 2); // 向上

      // ===== 输入系统 =====
      const keys = {};
      window.addEventListener('keydown', (event) => {
        keys[event.code] = true;
        if (event.code === 'Space') {
          event.preventDefault();
          if (playerState.isOnGround) {
            playerState.jumpVelocity = 9.2;
            playerState.isOnGround = false;
          }
        }
      });
      window.addEventListener('keyup', (event) => {
        keys[event.code] = false;
      });

      // ===== 鼠标控制相机 =====
      let cameraYaw = 0;
      let cameraPitch = 0.32;
      let pointerLocked = false;

      function onPointerMove(event) {
        if (!pointerLocked) return;
        cameraYaw -= event.movementX * 0.0024;
        cameraPitch -= event.movementY * 0.0018;
        cameraPitch = THREE.MathUtils.clamp(cameraPitch, -0.8, 1.1);
      }

      document.addEventListener('pointerlockchange', () => {
        pointerLocked = document.pointerLockElement === renderer.domElement;
        const alert = document.getElementById('alert');
        if (!pointerLocked) {
          alert.classList.add('show');
          alert.textContent = 'Click the scene to control the camera';
          alert.classList.remove('warn', 'danger');
        }
      });

      renderer.domElement.addEventListener('click', () => {
        renderer.domElement.requestPointerLock();
      });
      document.addEventListener('pointermove', onPointerMove);

      // ===== UI =====
      const distanceValue = document.getElementById('distanceValue');
      const speedValue = document.getElementById('speedValue');
      const alertEl = document.getElementById('alert');

      function showAlert(message, type = '') {
        alertEl.textContent = message;
        alertEl.classList.remove('warn', 'danger');
        if (type) alertEl.classList.add(type);
        alertEl.classList.add('show');
        clearTimeout(showAlert.timer);
        showAlert.timer = setTimeout(() => {
          alertEl.classList.remove('show');
        }, 950);
      }

      // ===== 碰撞检测 =====
      function resolveBuildingCollision(position) {
        const radius = playerState.radius;
        for (const building of buildings) {
          const bx = building.center.x;
          const bz = building.center.z;
          const halfX = building.size.x;
          const halfZ = building.size.z;
          const minX = bx - halfX - radius;
          const maxX = bx + halfX + radius;
          const minZ = bz - halfZ - radius;
          const maxZ = bz + halfZ + radius;

          const inX = position.x > minX && position.x < maxX;
          const inZ = position.z > minZ && position.z < maxZ;
          if (inX && inZ) {
            const dx = Math.abs(position.x - bx) - (halfX + radius);
            const dz = Math.abs(position.z - bz) - (halfZ + radius);

            if (dx < dz) {
              position.x = position.x < bx ? bx - halfX - radius : bx + halfX + radius;
            } else {
              position.z = position.z < bz ? bz - halfZ - radius : bz + halfZ + radius;
            }
          }
        }
      }

      function updateCars(delta) {
        for (const car of cars) {
          const direction = car.mesh.rotation.y;
          const forward = new THREE.Vector3(Math.sin(direction), 0, Math.cos(direction));
          car.mesh.position.addScaledVector(forward, car.speed * delta);

          // 简单边界回环，让车辆持续移动
          if (car.mesh.position.x > 90 || car.mesh.position.x < -90 || car.mesh.position.z > 90 || car.mesh.position.z < -90) {
            if (Math.abs(Math.sin(direction)) > 0.5) {
              car.mesh.position.x = -car.mesh.position.x;
            } else {
              car.mesh.position.z = -car.mesh.position.z;
            }
          }

          // 人物撞车：减速并提醒
          const playerPos = player.position;
          const dx = car.mesh.position.x - playerPos.x;
          const dz = car.mesh.position.z - playerPos.z;
          const dist = Math.hypot(dx, dz);
          if (dist < 2.1) {
            const currentSpeed = playerState.speed;
            playerState.speed = Math.max(0, currentSpeed * 0.5);
            showAlert('Car collision! Slow down.', 'warn');
            const dir = new THREE.Vector3(playerPos.x - car.mesh.position.x, 0, playerPos.z - car.mesh.position.z).normalize();
            player.position.add(dir.multiplyScalar(0.7));
          }
        }
      }

      // ===== 玩家更新 =====
      function updatePlayer(delta) {
        const moveInput = new THREE.Vector3();
        const forward = new THREE.Vector3(Math.sin(cameraYaw), 0, Math.cos(cameraYaw));
        const right = new THREE.Vector3(forward.z, 0, -forward.x);

        if (keys['KeyW']) moveInput.add(forward);
        if (keys['KeyS']) moveInput.sub(forward);
        if (keys['KeyA']) moveInput.sub(right);
        if (keys['KeyD']) moveInput.add(right);

        const moving = moveInput.lengthSq() > 0;
        if (moving) {
          moveInput.normalize();
          const targetDir = Math.atan2(moveInput.x, moveInput.z);
          playerState.heading = THREE.MathUtils.lerp(playerState.heading, targetDir, 0.12);
          player.rotation.y = playerState.heading;
        }

        const baseSpeed = 9.5;
        const sprintBoost = keys['ShiftLeft'] || keys['ShiftRight'] ? 7.5 : 0;
        const targetSpeed = moving ? baseSpeed + sprintBoost : 0;
        playerState.speed = THREE.MathUtils.lerp(playerState.speed, targetSpeed, 0.12);

        if (moving) {
          const stride = moveInput.clone().multiplyScalar(playerState.speed * delta);
          player.position.add(stride);
          playerState.totalDistance += playerState.speed * delta * 0.7;
        }

        // 重力与跳跃
        if (!playerState.isOnGround) {
          playerState.jumpVelocity -= 18 * delta;
          player.position.y += playerState.jumpVelocity * delta;
          if (player.position.y <= 0.8) {
            player.position.y = 0.8;
            playerState.jumpVelocity = 0;
            playerState.isOnGround = true;
          }
        }

        // 若脚底低于地面，则强制落地
        if (player.position.y < 0.8) {
          player.position.y = 0.8;
          playerState.isOnGround = true;
        }

        // 边界约束
        player.position.x = THREE.MathUtils.clamp(player.position.x, -94, 94);
        player.position.z = THREE.MathUtils.clamp(player.position.z, -94, 94);
        resolveBuildingCollision(player.position);

        if (!moving && !playerState.isOnGround) {
          playerState.totalDistance += 0.02;
        }
      }

      // ===== 相机更新 =====
      function updateCamera() {
        const behindDistance = 7.5;
        const heightOffset = 3.4;

        const lookTarget = player.position.clone().add(new THREE.Vector3(0, 2.1, 0));
        const camOffset = new THREE.Vector3(
          Math.sin(cameraYaw + Math.PI) * behindDistance,
          heightOffset + Math.sin(cameraPitch) * 2.5,
          Math.cos(cameraYaw + Math.PI) * behindDistance
        );

        const desiredCameraPos = lookTarget.clone().add(camOffset);
        camera.position.lerp(desiredCameraPos, 0.08);
        camera.lookAt(lookTarget);
      }

      // ===== 主循环 =====
      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);

        const delta = Math.min(clock.getDelta(), 0.033);
        updatePlayer(delta);
        updateCars(delta);
        updateCamera();

        const distKm = playerState.totalDistance / 1000;
        distanceValue.textContent = `${distKm.toFixed(2)} km`;
        speedValue.textContent = `${playerState.speed.toFixed(1)} m/s`;

        renderer.render(scene, camera);
      }

      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
